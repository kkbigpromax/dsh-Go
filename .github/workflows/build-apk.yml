name: Build fork APK

on:
  push:
    branches: [remove-anonymous-usage-stats]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: '0'
  DSH_BETA_TOKEN_FILE: ''
  TZ: Asia/Taipei

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y zstd
          flutter precache --android
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          extension="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk=$(sed -nE 's/.*ndkVersion.*"([0-9.]+)".*/\1/p' "$extension" | head -1)
          sdk=$(sed -nE 's/.*compileSdkVersion[^0-9]*([0-9]+).*/\1/p' "$extension" | head -1)
          test -n "$ndk" && test -n "$sdk"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-$sdk" "build-tools;$sdk.0.0" "ndk;$ndk" 'cmake;3.22.1'
      - name: Resolve locked App dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Check source and generated inputs
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
          cd app
          flutter analyze --no-pub
      - name: Prepare the Gradle wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/fork-gradle-wrapper"
          touch "$RUNNER_TEMP/fork-gradle-wrapper/build.gradle"
          gradle -p "$RUNNER_TEMP/fork-gradle-wrapper" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp "$RUNNER_TEMP/fork-gradle-wrapper/gradlew" app/android/gradlew
          cp "$RUNNER_TEMP/fork-gradle-wrapper/gradle/wrapper/"* app/android/gradle/wrapper/
          chmod +x app/android/gradlew
      - name: Build the modified phone runtime
        run: bash runtime/build-runtime.sh arm64-v8a
      - name: Verify runtime inputs
        run: |
          python3 -I tooling/check_runtime_bundle.py arm64
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('runtime/out/arm64-v8a/assets/runtime/manifest.json').read_text())
          assert 'remove-deepseek-session-log.diff' in manifest['dshPatches'], manifest['dshPatches']
          print('Bundled engine includes the session-log removal patch.')
          PY
      - name: Build release APK
        run: bash tooling/build-apk.sh --flavor arm64 --build-name 1.0.16-fork.1 --keep-daemon
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk dist/dsh-go-1.0.16-fork.1-arm64.apk
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-fork-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
